services:
  db:
    image: postgres:16-alpine
    container_name: ekimove-db
    environment:
      POSTGRES_DB: ekimove
      POSTGRES_USER: ekimove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "5432:5432"
    volumes:
      - ekimove_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekimove -d ekimove"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ekimove_pgdata:
