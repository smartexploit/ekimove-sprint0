# Weekly checks for security fixes in EkiMove's libraries. Dependabot opens
# a pull request when an update is available; review and merge it like any
# other change. Switch on "Dependabot alerts" and "Dependabot security
# updates" under the repository's Settings → Code security as well.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
